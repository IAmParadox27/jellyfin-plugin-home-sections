<form id="config-page" class="configForm" style="margin: 0 auto;">
    <div class="verticalSection verticalSection-extrabottompadding">
        <h2 class="sectionTitle" data-i18n="AdminModularHomeSettings">Modular Home  - Settings:</h2>

        <div class="verticalSection verticalSection-extrabottompadding">
            <label class="checkboxContainer">
                <input is="emby-checkbox" type="checkbox" id="modularHomeEnabled" />
                <span data-i18n="AdminEnableModularHome">Enable "Modular Home". This will change your home screen into a more dynamic screen with options from other plugins to be able to contribute into what you see and are recommended.</span>
            </label>
        </div>

        <div class="verticalSection verticalSection-extrabottompadding">
            <h3 data-i18n="AdminEnabledSections">Enabled Sections</h3>
            <p class="fieldDescription" data-i18n="AdminUserSectionOrderHint" style="margin-top: 0;">
                Enable sections and drag the handle (or use the arrows) to set your personal home screen order. Top items appear first.
            </p>
            <div id="enabledSections" class="user-section-list">
            </div>
            <div style="margin-top: 1em;">
                <button type="button" id="btnResetUserSections" class="raised emby-button">
                    <span data-i18n="AdminResetToDefaults">Reset to server defaults</span>
                </button>
                <div class="fieldDescription" data-i18n="AdminResetToDefaultsDesc" style="margin-top: 0.5em;">
                    Restore enabled sections and order to the values configured by your server admin. You still need to click Save.
                </div>
            </div>
        </div>

    </div>
    <button is="emby-button" type="submit" class="raised button-submit block btnSave">
        <span data-i18n="AdminSave">Save</span>
    </button>
</form>
<style>
    .user-section-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .user-section-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: opacity 0.15s ease, box-shadow 0.15s ease;
    }
    .user-section-row.user-section-dragging {
        opacity: 0.5;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .user-section-row.user-section-drag-over-above {
        box-shadow: inset 0 2px 0 0 var(--primary-accent-color, #00a4dc);
    }
    .user-section-row.user-section-drag-over-below {
        box-shadow: inset 0 -2px 0 0 var(--primary-accent-color, #00a4dc);
    }
    .user-section-row .user-section-drag-handle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        cursor: grab;
        color: #9aa0a6;
        border-radius: 6px;
        user-select: none;
        touch-action: none;
    }
    .user-section-row .user-section-drag-handle:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }
    .user-section-row .user-section-drag-handle:active {
        cursor: grabbing;
    }
    .user-section-row .user-section-drag-handle .material-icons {
        font-size: 20px;
    }
    .user-section-row.is-locked .user-section-drag-handle {
        opacity: 0.35;
        cursor: default;
        pointer-events: none;
    }
    .user-section-row .user-section-moves {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 0 0 auto;
    }
    .user-section-row .user-section-moves button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #9aa0a6;
        cursor: pointer;
    }
    .user-section-row .user-section-moves button:hover:not(:disabled) {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }
    .user-section-row .user-section-moves button:disabled {
        opacity: 0.3;
        cursor: default;
    }
    .user-section-row .user-section-moves .material-icons {
        font-size: 18px;
    }
    .user-section-row .checkboxContainer {
        flex: 1 1 auto;
        margin: 0;
    }
    .user-section-row.is-locked {
        opacity: 0.55;
    }
</style>
<script defer>

    if (window.HomeScreenSectionsUserSettings === undefined) {

        window.HomeScreenSectionsUserSettings = {
            setup: function () {
                var uiLanguage = document.documentElement.lang || navigator.language || 'en';
                var pageTranslations = {};
                var lastUserSettings = null;
                var lastSectionsResponse = null;

                function t(key, fallback) {
                    return pageTranslations[key] || fallback;
                }

                function applyDefaultUserSections() {
                    if (!lastUserSettings || !lastSectionsResponse) {
                        return;
                    }
                    var defaults = lastUserSettings.DefaultEnabledSections || [];
                    var list = document.querySelector('#enabledSections .user-section-list');
                    if (!list) {
                        return;
                    }
                    var defaultOrder = (lastSectionsResponse.Items || []).map(function (s) { return s.Section; });
                    defaultOrder.forEach(function (sectionId) {
                        var row = list.querySelector('.user-section-row[data-section="' + sectionId + '"]');
                        if (row) {
                            list.appendChild(row);
                        }
                    });
                    list.querySelectorAll('.user-section-row').forEach(function (row) {
                        var sectionId = row.getAttribute('data-section');
                        var checkbox = row.querySelector('.sectionEnabledCheckbox');
                        if (!checkbox || checkbox.disabled) {
                            return;
                        }
                        checkbox.checked = defaults.indexOf(sectionId) !== -1;
                    });
                    updateUserSectionMoveButtons();
                    Dashboard.alert(t('AdminResetToDefaultsDone', 'Restored server defaults. Click Save to apply.'));
                }

                function updateUserSectionMoveButtons() {
                    var rows = Array.prototype.slice.call(document.querySelectorAll('#enabledSections .user-section-row'));
                    rows.forEach(function (row, index) {
                        var up = row.querySelector('[data-move="up"]');
                        var down = row.querySelector('[data-move="down"]');
                        if (up) {
                            up.disabled = index === 0 || row.classList.contains('is-locked');
                        }
                        if (down) {
                            down.disabled = index === rows.length - 1 || row.classList.contains('is-locked');
                        }
                    });
                }

                function moveUserSectionRow(row, direction) {
                    var list = document.querySelector('#enabledSections .user-section-list')
                        || document.querySelector('#enabledSections');
                    if (!list || !row || row.classList.contains('is-locked')) {
                        return;
                    }
                    if (direction < 0) {
                        var prev = row.previousElementSibling;
                        if (prev) {
                            list.insertBefore(row, prev);
                        }
                    } else if (direction > 0) {
                        var next = row.nextElementSibling;
                        if (next) {
                            list.insertBefore(next, row);
                        }
                    }
                    updateUserSectionMoveButtons();
                }

                var userDragState = { row: null, allowDrag: false };

                function clearUserDragOver() {
                    document.querySelectorAll('#enabledSections .user-section-drag-over-above, #enabledSections .user-section-drag-over-below')
                        .forEach(function (el) {
                            el.classList.remove('user-section-drag-over-above', 'user-section-drag-over-below');
                        });
                }

                function setupUserSectionRowDrag(row) {
                    if (row.classList.contains('is-locked') || row.dataset.dragBound === 'true') {
                        return;
                    }
                    row.dataset.dragBound = 'true';
                    row.setAttribute('draggable', 'true');

                    var handle = row.querySelector('.user-section-drag-handle');
                    if (handle) {
                        handle.addEventListener('pointerdown', function () {
                            userDragState.allowDrag = true;
                        });
                    }

                    row.addEventListener('dragstart', function (e) {
                        if (!userDragState.allowDrag) {
                            e.preventDefault();
                            return;
                        }
                        userDragState.row = row;
                        row.classList.add('user-section-dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        try {
                            e.dataTransfer.setData('text/plain', row.getAttribute('data-section') || '');
                        } catch (err) { /* ignore */ }
                    });

                    row.addEventListener('dragend', function () {
                        row.classList.remove('user-section-dragging');
                        userDragState.row = null;
                        userDragState.allowDrag = false;
                        clearUserDragOver();
                        updateUserSectionMoveButtons();
                    });

                    row.addEventListener('dragover', function (e) {
                        if (!userDragState.row || userDragState.row === row) {
                            return;
                        }
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        var rect = row.getBoundingClientRect();
                        var insertBefore = e.clientY < rect.top + rect.height / 2;
                        clearUserDragOver();
                        row.classList.add(insertBefore ? 'user-section-drag-over-above' : 'user-section-drag-over-below');
                    });

                    row.addEventListener('drop', function (e) {
                        e.preventDefault();
                        var dragged = userDragState.row;
                        if (!dragged || dragged === row) {
                            clearUserDragOver();
                            return;
                        }
                        var list = document.querySelector('#enabledSections .user-section-list');
                        if (!list) {
                            return;
                        }
                        var rect = row.getBoundingClientRect();
                        var insertBefore = e.clientY < rect.top + rect.height / 2;
                        if (insertBefore) {
                            list.insertBefore(dragged, row);
                        } else {
                            list.insertBefore(dragged, row.nextSibling);
                        }
                        clearUserDragOver();
                        updateUserSectionMoveButtons();
                    });
                }

                // Translate static page elements
                ApiClient.fetch({
                    url: ApiClient.getUrl('ModularHomeViews/Translations') + '?language=' + encodeURIComponent(uiLanguage),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (translations) {
                    pageTranslations = translations;
                    document.querySelectorAll('[data-i18n]').forEach(function (el) {
                        var key = el.getAttribute('data-i18n');
                        if (translations[key]) {
                            el.textContent = translations[key];
                        }
                    });
                }).catch(function (error) {
                    console.warn('Failed to load translations:', error);
                });

                ApiClient.fetch({
                    url: ApiClient.getUrl('HomeScreen/Meta'),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (hssMeta) {
                    ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                        document.querySelector('#modularHomeEnabled').checked = userSettings.CustomPrefs['useModularHome'] === 'true';
                    });

                    if (!document.querySelector('#modularHomeEnabled').checked) {
                        document.querySelector('#modularHomeEnabled').checked = hssMeta.Enabled;
                    }

                    if (hssMeta.AllowUserOverride !== true) {
                        document.querySelector('#modularHomeEnabled').disabled = true;
                        document.querySelector('#modularHomeEnabled').parentElement.style.opacity = "0.5";
                    }

                    ApiClient.fetch({
                        url: ApiClient.getUrl('ModularHomeViews/UserSettings?userId=' + ApiClient.getCurrentUserId()),
                        type: 'GET',
                        dataType: 'json',
                        headers: {
                            accept: 'application/json'
                        }
                    }).then(function (settings) {
                        lastUserSettings = settings;
                        ApiClient.fetch({
                            url: ApiClient.getUrl('ModularHomeViews/Sections') + '?language=' + encodeURIComponent(uiLanguage),
                            type: 'GET',
                            dataType: 'json',
                            headers: {
                                accept: 'application/json'
                            }
                        }).then(function (response) {
                            lastSectionsResponse = response;
                            if (response.TotalRecordCount > 0) {
                                var items = response.Items.slice();
                                var savedOrder = Array.isArray(settings.SectionOrder) ? settings.SectionOrder : [];
                                if (savedOrder.length > 0) {
                                    var rank = {};
                                    savedOrder.forEach(function (id, idx) {
                                        if (rank[id] === undefined) {
                                            rank[id] = idx;
                                        }
                                    });
                                    items.sort(function (a, b) {
                                        var ra = rank[a.Section];
                                        var rb = rank[b.Section];
                                        if (ra === undefined && rb === undefined) {
                                            return 0;
                                        }
                                        if (ra === undefined) {
                                            return 1;
                                        }
                                        if (rb === undefined) {
                                            return -1;
                                        }
                                        return ra - rb;
                                    });
                                }

                                var list = document.createElement('div');
                                list.className = 'user-section-list';

                                items.forEach(function (section) {
                                    var disabled = !hssMeta.AllowUserOverride;
                                    var checked = false;
                                    if (settings.EnabledSections.includes(section.Section)) {
                                        checked = true;
                                    }

                                    if (!disabled) {
                                        if (settings.LockedSections.includes(section.Section)) {
                                            disabled = true;
                                        }
                                    }

                                    if (disabled) {
                                        checked = settings.DefaultEnabledSections.includes(section.Section);
                                    }

                                    var row = document.createElement('div');
                                    row.className = 'user-section-row' + (disabled ? ' is-locked' : '');
                                    row.setAttribute('data-section', section.Section);

                                    var handle = document.createElement('span');
                                    handle.className = 'user-section-drag-handle';
                                    handle.setAttribute('title', t('AdminOrderDragHint', 'Drag to reorder'));
                                    handle.setAttribute('aria-label', t('AdminOrderDragHint', 'Drag to reorder'));
                                    handle.innerHTML = '<span class="material-icons" aria-hidden="true">drag_indicator</span>';

                                    var moves = document.createElement('div');
                                    moves.className = 'user-section-moves';
                                    moves.innerHTML =
                                        '<button type="button" data-move="up" title="' + t('AdminMoveUp', 'Move up') + '" aria-label="' + t('AdminMoveUp', 'Move up') + '">' +
                                            '<span class="material-icons" aria-hidden="true">keyboard_arrow_up</span></button>' +
                                        '<button type="button" data-move="down" title="' + t('AdminMoveDown', 'Move down') + '" aria-label="' + t('AdminMoveDown', 'Move down') + '">' +
                                            '<span class="material-icons" aria-hidden="true">keyboard_arrow_down</span></button>';
                                    moves.querySelector('[data-move="up"]').addEventListener('click', function () {
                                        moveUserSectionRow(row, -1);
                                    });
                                    moves.querySelector('[data-move="down"]').addEventListener('click', function () {
                                        moveUserSectionRow(row, 1);
                                    });

                                    var label = document.createElement('label');
                                    label.className = 'checkboxContainer';
                                    label.style.cssText = disabled ? 'opacity: 0.5; margin: 0;' : 'margin: 0;';
                                    label.innerHTML =
                                        '<input ' + (disabled ? 'disabled="true"' : '') +
                                        ' is="emby-checkbox" type="checkbox" class="sectionEnabledCheckbox" data-section="' +
                                        section.Section + '" ' + (checked ? 'checked' : '') + ' />' +
                                        '<span>' + section.DisplayText + '</span>';

                                    row.appendChild(handle);
                                    row.appendChild(moves);
                                    row.appendChild(label);
                                    list.appendChild(row);
                                    setupUserSectionRowDrag(row);
                                });

                                var elem = document.querySelector('#enabledSections');
                                elem.innerHTML = '';
                                elem.appendChild(list);
                                updateUserSectionMoveButtons();
                            }
                        });
                    });
                });

                var resetBtn = document.querySelector('#btnResetUserSections');
                if (resetBtn) {
                    resetBtn.addEventListener('click', function () {
                        applyDefaultUserSections();
                    });
                }

                document.querySelector('.configForm')
                    .addEventListener('submit', function (e) {
                        ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                            userSettings.CustomPrefs['useModularHome'] = document.querySelector('#modularHomeEnabled').checked ? 'true' : 'false';

                            ApiClient.updateDisplayPreferences('usersettings', userSettings, ApiClient.getCurrentUserId(), 'emby');
                        });

                        let data = {
                            UserId: ApiClient.getCurrentUserId(),
                            EnabledSections: [],
                            SectionOrder: []
                        };

                        let rows = document.querySelectorAll('#enabledSections .user-section-row');
                        rows.forEach(function (row) {
                            let sectionId = row.getAttribute('data-section');
                            data.SectionOrder.push(sectionId);

                            let checkbox = row.querySelector('.sectionEnabledCheckbox');
                            if (checkbox && checkbox.checked) {
                                data.EnabledSections.push(sectionId);
                            }
                        });

                        ApiClient.ajax({
                            url: ApiClient.getUrl('ModularHomeViews/UserSettings'),
                            type: 'POST',
                            data: JSON.stringify(data),
                            contentType: 'application/json'
                        }).then(function () {
                            var message = pageTranslations['AdminSettingsUpdatedToast']
                                || pageTranslations['AdminSettingsUpdated']
                                || 'Settings saved. Refresh home to see order changes.';
                            Dashboard.alert(message);
                        }).catch(function (error) {
                            console.error(error);
                            Dashboard.alert(pageTranslations['AdminSettingsSaveFailed'] || 'Failed to save settings.');
                        });

                        e.preventDefault();
                        return false;
                    });
            }
        }
    }

    window.HomeScreenSectionsUserSettings.setup();
</script>
