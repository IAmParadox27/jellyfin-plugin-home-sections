<form id="config-page" class="configForm" style="margin: 0 auto;">
    <div class="verticalSection verticalSection-extrabottompadding">
        <h2 class="sectionTitle" data-i18n="AdminModularHomeSettings">Modular Home  - Settings:</h2>

        <div class="verticalSection verticalSection-extrabottompadding">
            <label class="checkboxContainer">
                <input is="emby-checkbox" type="checkbox" id="modularHomeEnabled" />
                <span data-i18n="AdminEnableModularHome">Enable "Modular Home". This will change your home screen into a more dynamic screen with options from other plugins to be able to contribute into what you see and are recommended.</span>
            </label>
        </div>

        <div class="verticalSection verticalSection-extrabottompadding">
            <h3 data-i18n="AdminEnabledSections">Enabled Sections</h3>
            <p class="fieldDescription" data-i18n="AdminUserSectionOrderHint" style="margin-top: 0;">
                Enable sections and use the arrows to set your personal home screen order. Top items appear first.
            </p>
            <div id="enabledSections" class="user-section-list">
            </div>
        </div>

    </div>
    <button is="emby-button" type="submit" class="raised button-submit block btnSave">
        <span data-i18n="AdminSave">Save</span>
    </button>
</form>
<style>
    .user-section-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .user-section-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-section-row .user-section-moves {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 0 0 auto;
    }
    .user-section-row .user-section-moves button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #9aa0a6;
        cursor: pointer;
    }
    .user-section-row .user-section-moves button:hover:not(:disabled) {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }
    .user-section-row .user-section-moves button:disabled {
        opacity: 0.3;
        cursor: default;
    }
    .user-section-row .user-section-moves .material-icons {
        font-size: 18px;
    }
    .user-section-row .checkboxContainer {
        flex: 1 1 auto;
        margin: 0;
    }
    .user-section-row.is-locked {
        opacity: 0.55;
    }
</style>
<script defer>

    if (window.HomeScreenSectionsUserSettings === undefined) {

        window.HomeScreenSectionsUserSettings = {
            setup: function () {
                var uiLanguage = document.documentElement.lang || navigator.language || 'en';
                var pageTranslations = {};

                function t(key, fallback) {
                    return pageTranslations[key] || fallback;
                }

                function updateUserSectionMoveButtons() {
                    var rows = Array.prototype.slice.call(document.querySelectorAll('#enabledSections .user-section-row'));
                    rows.forEach(function (row, index) {
                        var up = row.querySelector('[data-move="up"]');
                        var down = row.querySelector('[data-move="down"]');
                        if (up) {
                            up.disabled = index === 0 || row.classList.contains('is-locked');
                        }
                        if (down) {
                            down.disabled = index === rows.length - 1 || row.classList.contains('is-locked');
                        }
                    });
                }

                function moveUserSectionRow(row, direction) {
                    var list = document.querySelector('#enabledSections');
                    if (!list || !row || row.classList.contains('is-locked')) {
                        return;
                    }
                    if (direction < 0) {
                        var prev = row.previousElementSibling;
                        if (prev) {
                            list.insertBefore(row, prev);
                        }
                    } else if (direction > 0) {
                        var next = row.nextElementSibling;
                        if (next) {
                            list.insertBefore(next, row);
                        }
                    }
                    updateUserSectionMoveButtons();
                }

                // Translate static page elements
                ApiClient.fetch({
                    url: ApiClient.getUrl('ModularHomeViews/Translations') + '?language=' + encodeURIComponent(uiLanguage),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (translations) {
                    pageTranslations = translations;
                    document.querySelectorAll('[data-i18n]').forEach(function (el) {
                        var key = el.getAttribute('data-i18n');
                        if (translations[key]) {
                            el.textContent = translations[key];
                        }
                    });
                }).catch(function (error) {
                    console.warn('Failed to load translations:', error);
                });

                ApiClient.fetch({
                    url: ApiClient.getUrl('HomeScreen/Meta'),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (hssMeta) {
                    ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                        document.querySelector('#modularHomeEnabled').checked = userSettings.CustomPrefs['useModularHome'] === 'true';
                    });

                    if (!document.querySelector('#modularHomeEnabled').checked) {
                        document.querySelector('#modularHomeEnabled').checked = hssMeta.Enabled;
                    }

                    if (hssMeta.AllowUserOverride !== true) {
                        document.querySelector('#modularHomeEnabled').disabled = true;
                        document.querySelector('#modularHomeEnabled').parentElement.style.opacity = "0.5";
                    }

                    ApiClient.fetch({
                        url: ApiClient.getUrl('ModularHomeViews/UserSettings?userId=' + ApiClient.getCurrentUserId()),
                        type: 'GET',
                        dataType: 'json',
                        headers: {
                            accept: 'application/json'
                        }
                    }).then(function (settings) {
                        ApiClient.fetch({
                            url: ApiClient.getUrl('ModularHomeViews/Sections') + '?language=' + encodeURIComponent(uiLanguage),
                            type: 'GET',
                            dataType: 'json',
                            headers: {
                                accept: 'application/json'
                            }
                        }).then(function (response) {
                            if (response.TotalRecordCount > 0) {
                                var items = response.Items.slice();
                                var savedOrder = Array.isArray(settings.SectionOrder) ? settings.SectionOrder : [];
                                if (savedOrder.length > 0) {
                                    var rank = {};
                                    savedOrder.forEach(function (id, idx) {
                                        if (rank[id] === undefined) {
                                            rank[id] = idx;
                                        }
                                    });
                                    items.sort(function (a, b) {
                                        var ra = rank[a.Section];
                                        var rb = rank[b.Section];
                                        if (ra === undefined && rb === undefined) {
                                            return 0;
                                        }
                                        if (ra === undefined) {
                                            return 1;
                                        }
                                        if (rb === undefined) {
                                            return -1;
                                        }
                                        return ra - rb;
                                    });
                                }

                                var list = document.createElement('div');
                                list.className = 'user-section-list';

                                items.forEach(function (section) {
                                    var disabled = !hssMeta.AllowUserOverride;
                                    var checked = false;
                                    if (settings.EnabledSections.includes(section.Section)) {
                                        checked = true;
                                    }

                                    if (!disabled) {
                                        if (settings.LockedSections.includes(section.Section)) {
                                            disabled = true;
                                        }
                                    }

                                    if (disabled) {
                                        checked = settings.DefaultEnabledSections.includes(section.Section);
                                    }

                                    var row = document.createElement('div');
                                    row.className = 'user-section-row' + (disabled ? ' is-locked' : '');
                                    row.setAttribute('data-section', section.Section);

                                    var moves = document.createElement('div');
                                    moves.className = 'user-section-moves';
                                    moves.innerHTML =
                                        '<button type="button" data-move="up" title="' + t('AdminMoveUp', 'Move up') + '" aria-label="' + t('AdminMoveUp', 'Move up') + '">' +
                                            '<span class="material-icons" aria-hidden="true">keyboard_arrow_up</span></button>' +
                                        '<button type="button" data-move="down" title="' + t('AdminMoveDown', 'Move down') + '" aria-label="' + t('AdminMoveDown', 'Move down') + '">' +
                                            '<span class="material-icons" aria-hidden="true">keyboard_arrow_down</span></button>';
                                    moves.querySelector('[data-move="up"]').addEventListener('click', function () {
                                        moveUserSectionRow(row, -1);
                                    });
                                    moves.querySelector('[data-move="down"]').addEventListener('click', function () {
                                        moveUserSectionRow(row, 1);
                                    });

                                    var label = document.createElement('label');
                                    label.className = 'checkboxContainer';
                                    label.style.cssText = disabled ? 'opacity: 0.5; margin: 0;' : 'margin: 0;';
                                    label.innerHTML =
                                        '<input ' + (disabled ? 'disabled="true"' : '') +
                                        ' is="emby-checkbox" type="checkbox" class="sectionEnabledCheckbox" data-section="' +
                                        section.Section + '" ' + (checked ? 'checked' : '') + ' />' +
                                        '<span>' + section.DisplayText + '</span>';

                                    row.appendChild(moves);
                                    row.appendChild(label);
                                    list.appendChild(row);
                                });

                                var elem = document.querySelector('#enabledSections');
                                elem.innerHTML = '';
                                elem.appendChild(list);
                                updateUserSectionMoveButtons();
                            }
                        });
                    });
                });

                document.querySelector('.configForm')
                    .addEventListener('submit', function (e) {
                        ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                            userSettings.CustomPrefs['useModularHome'] = document.querySelector('#modularHomeEnabled').checked ? 'true' : 'false';

                            ApiClient.updateDisplayPreferences('usersettings', userSettings, ApiClient.getCurrentUserId(), 'emby');
                        });

                        let data = {
                            UserId: ApiClient.getCurrentUserId(),
                            EnabledSections: [],
                            SectionOrder: []
                        };

                        let rows = document.querySelectorAll('#enabledSections .user-section-row');
                        rows.forEach(function (row) {
                            let sectionId = row.getAttribute('data-section');
                            data.SectionOrder.push(sectionId);

                            let checkbox = row.querySelector('.sectionEnabledCheckbox');
                            if (checkbox && checkbox.checked) {
                                data.EnabledSections.push(sectionId);
                            }
                        });

                        ApiClient.ajax({
                            url: ApiClient.getUrl('ModularHomeViews/UserSettings'),
                            type: 'POST',
                            data: JSON.stringify(data),
                            contentType: 'application/json'
                        }).then(function () {
                            Dashboard.alert(pageTranslations['AdminSettingsUpdated'] || 'Settings have been updated, reloading page in 2 seconds.');

                            setTimeout(function () {
                                location.reload(true);
                            }, 2000);
                        })

                        e.preventDefault();
                        return false;
                    });
            }
        }
    }

    window.HomeScreenSectionsUserSettings.setup();
</script>
