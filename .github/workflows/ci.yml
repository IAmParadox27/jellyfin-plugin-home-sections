name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Analyzers + TreatWarningsAsErrors come from src/Directory.Build.props
      # (Meziantou.Analyzer + .NET analyzers). Build fails on enforced rules.
      - name: Build plugin (10.11.11)
        run: >
          dotnet build
          src/Jellyfin.Plugin.HomeScreenSections/Jellyfin.Plugin.HomeScreenSections.csproj
          -c Release
          -p:JellyfinVersion=10.11.11

      - name: Build plugin (10.10.7)
        run: >
          dotnet build
          src/Jellyfin.Plugin.HomeScreenSections/Jellyfin.Plugin.HomeScreenSections.csproj
          -c Release
          -p:JellyfinVersion=10.10.7

      - name: Test
        run: >
          dotnet test
          src/Jellyfin.Plugin.HomeScreenSections.Tests/Jellyfin.Plugin.HomeScreenSections.Tests.csproj
          -c Release
          --verbosity normal
