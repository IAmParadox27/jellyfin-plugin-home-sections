name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node (for TypeScript web assets)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install web dependencies
        run: npm ci

      - name: Type-check web assets (strict, SDK-typed)
        run: npm run typecheck

      # Analyzers + TreatWarningsAsErrors come from src/Directory.Build.props
      # (Meziantou.Analyzer + .NET analyzers). Build fails on enforced rules.
      # Web assets are rebuilt automatically via BeforeBuild (npm run build),
      # but we already type-checked above for clearer logs.
      - name: Build plugin (10.11.11)
        run: >
          dotnet build
          src/Jellyfin.Plugin.HomeScreenSections/Jellyfin.Plugin.HomeScreenSections.csproj
          -c Release
          -p:JellyfinVersion=10.11.11

      - name: Build plugin (10.10.7)
        run: >
          dotnet build
          src/Jellyfin.Plugin.HomeScreenSections/Jellyfin.Plugin.HomeScreenSections.csproj
          -c Release
          -p:JellyfinVersion=10.10.7

      - name: Test with coverage
        run: >
          dotnet test
          src/Jellyfin.Plugin.HomeScreenSections.Tests/Jellyfin.Plugin.HomeScreenSections.Tests.csproj
          -c Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Fails the build when line coverage drops below 80%.
      - name: Coverage gate
        shell: pwsh
        run: |
          $report = Get-ChildItem ./TestResults -Recurse -Filter coverage.cobertura.xml |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $report) { throw 'No coverage report was produced.' }

          [xml]$coverage = Get-Content $report.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $branchRate = [double]$coverage.coverage.'branch-rate'
          Write-Host ("Line coverage:   {0:N2}% ({1}/{2} lines)" -f ($lineRate * 100), $coverage.coverage.'lines-covered', $coverage.coverage.'lines-valid')
          Write-Host ("Branch coverage: {0:N2}%" -f ($branchRate * 100))

          if ($lineRate -lt 0.80) {
            throw ("Line coverage {0:N2}% is below the required 80% threshold." -f ($lineRate * 100))
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
